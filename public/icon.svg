<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" />
  
  <!-- Central School Icon Graphics -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- School main building outline -->
    <!-- Triangular roof pediment -->
    <polygon points="256,110 110,186 402,186" fill="#ffffff" stroke="none" />
    <!-- School flagpole / bell spire -->
    <rect x="251" y="70" width="10" height="40" fill="#ffffff" stroke="none" />
    <polygon points="261,72 295,84 261,96" fill="#60a5fa" stroke="none" />
    
    <!-- Architrave / Top beam -->
    <rect x="130" y="194" width="252" height="18" rx="4" fill="#ffffff" stroke="none" />
    
    <!-- 4 Elegant Columns -->
    <rect x="146" y="220" width="28" height="150" rx="6" fill="#ffffff" stroke="none" />
    <rect x="210" y="220" width="28" height="150" rx="6" fill="#ffffff" stroke="none" />
    <rect x="274" y="220" width="28" height="150" rx="6" fill="#ffffff" stroke="none" />
    <rect x="338" y="220" width="28" height="150" rx="6" fill="#ffffff" stroke="none" />
    
    <!-- Center arch entrance inside building -->
    <path d="M 234 370 V 290 A 22 22 0 0 1 278 290 V 370 Z" fill="#1d4ed8" stroke="none" />
    
    <!-- Stairs / Foundation Base -->
    <rect x="110" y="376" width="292" height="22" rx="6" fill="#ffffff" stroke="none" />
    <rect x="88" y="404" width="336" height="22" rx="6" fill="#ffffff" stroke="none" />
    
    <!-- Shield with Checkmark (Security / Access Badge) in Pediment -->
    <circle cx="256" cy="158" r="16" fill="#2563eb" stroke="none" />
    <path d="M 249 158 L 254 163 L 263 153" fill="none" stroke="#ffffff" stroke-width="3.5" />
  </g>
</svg>
